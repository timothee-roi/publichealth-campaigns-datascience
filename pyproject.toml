[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phc"
version = "1.0.0"
description = "Media coverage and search interest during French health awareness campaigns: Granger causality and transfer functions beyond the campaign calendar"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Timothée Roina" }]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "statsmodels>=0.14",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "joblib>=1.3",
]

[project.optional-dependencies]
notebooks = ["jupyterlab>=4.0", "pillow>=10.0"]
collect = ["pytrends>=4.9", "mediacloud>=4.0", "newspaper4k>=0.9", "lxml_html_clean"]
test = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
